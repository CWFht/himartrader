<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>하이마트 특가 대시보드</title>
  <meta name="description" content="하이마트 원데이핫딜과 미개봉상품 특가를 이미지, 가격, 남은수량 중심으로 모아보는 상담용 대시보드" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="eyebrow">HIMART DEAL DASHBOARD</div>
      <h1>하이마트 특가 대시보드</h1>
      <p>원데이핫딜과 미개봉상품 특가를 이미지·가격·남은수량 중심으로 빠르게 확인하는 상담용 페이지입니다.</p>
      <div class="hero-actions">
        <span id="updatedAt" class="pill live">데이터 확인 중</span>
        <a class="pill link" href="https://www.e-himart.co.kr/app/displayPlan/listPlanDetail?spdpNo=7630" target="_blank" rel="noopener">원데이핫딜 원본</a>
        <a class="pill link" href="https://www.e-himart.co.kr/app/display/unopenedHall" target="_blank" rel="noopener">미개봉특가 원본</a>
      </div>
    </header>

    <section id="notice" class="notice hidden"></section>

    <section class="top-summary" aria-label="요약 지표">
      <article>
        <span>표시 상품</span>
        <strong id="statCount">0개</strong>
      </article>
      <article>
        <span>최고 할인율</span>
        <strong id="statDiscount">-</strong>
      </article>
      <article>
        <span>최저 판매가</span>
        <strong id="statLowest">-</strong>
      </article>
      <article>
        <span>남은수량 합계</span>
        <strong id="statQty">-</strong>
      </article>
    </section>

    <nav class="tabs" aria-label="특가 종류 선택">
      <button class="tab active" data-tab="oneday">오늘의 특가</button>
      <button class="tab" data-tab="unopened">미개봉상품 특가</button>
    </nav>

    <section id="dashboardHero" class="deal-hero"></section>

    <section class="filters" aria-label="필터">
      <label class="search-box">
        <span>검색</span>
        <input id="searchInput" type="search" placeholder="브랜드·상품명 검색" />
      </label>

      <label>
        <span>카테고리</span>
        <select id="categoryFilter"></select>
      </label>

      <label>
        <span>할인율</span>
        <select id="discountFilter">
          <option value="all">전체</option>
          <option value="50">50% 이상</option>
          <option value="40">40% 이상</option>
          <option value="30">30% 이상</option>
          <option value="20">20% 이상</option>
          <option value="10">10% 이상</option>
        </select>
      </label>

      <label>
        <span>가격대</span>
        <select id="priceFilter">
          <option value="all">전체</option>
          <option value="under10000">1만원 이하</option>
          <option value="10000-50000">1만~5만원</option>
          <option value="50000-100000">5만~10만원</option>
          <option value="100000-300000">10만~30만원</option>
          <option value="300000-700000">30만~70만원</option>
          <option value="over700000">70만원 이상</option>
        </select>
      </label>

      <label>
        <span>정렬</span>
        <select id="sortSelect">
          <option value="remainingAsc">남은수량 적은순</option>
          <option value="priceAsc">낮은가격순</option>
          <option value="priceDesc">높은가격순</option>
          <option value="discountDesc">할인율 높은순</option>
          <option value="benefitAsc">최대혜택가 낮은순</option>
          <option value="brandAsc">브랜드순</option>
        </select>
      </label>
    </section>

    <main>
      <div id="resultTitle" class="result-title">상품 표시 중</div>
      <section id="dealGrid" class="deal-grid" aria-label="상품 목록"></section>
      <section id="emptyState" class="empty-state hidden">
        <strong>표시할 상품이 없습니다.</strong>
        <p>필터를 초기화하거나 원본 페이지를 확인해 주세요.</p>
      </section>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
