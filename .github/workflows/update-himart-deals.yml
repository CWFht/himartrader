name: Update Himart Deals

on:
  workflow_dispatch:
  schedule:
    # 2시간마다 갱신. 한국시간 기준 00시 전후 변경분도 잡기 위함.
    - cron: '10 */2 * * *'

permissions:
  contents: write

concurrency:
  group: himart-deal-dashboard-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Collect Himart deal data
        run: npm run collect

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/debug.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Himart deal dashboard data"
            git push
          fi
